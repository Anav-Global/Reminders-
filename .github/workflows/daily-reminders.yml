name: Daily Task Reminders

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST — shift start, full reminders.
    - cron: "30 13 * * *"
    # 22:30 UTC = 4:00 AM IST (next calendar day) — shift end, escalation only.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "full or escalation-only (only used for manual test runs; scheduled runs set this automatically)"
        required: false
        default: "full"

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Send reminder emails
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SYSTEM_USER_EMAIL: ${{ secrets.SYSTEM_USER_EMAIL }}
          SYSTEM_USER_PASSWORD: ${{ secrets.SYSTEM_USER_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_MODE: ${{ github.event.inputs.run_mode || (github.event.schedule == '30 22 * * *' && 'escalation-only' || 'full') }}
        run: node cleanup-runaway-tasks.js
